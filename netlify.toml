# Existing files, including prerendered /about/index.html and /blog/index.html,
# are served before this rewrite.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/forms"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/forms/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/settings"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/subscribers"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/campaigns"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/templates"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/templates/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/signup"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/forgot-password"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/reset-password"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
